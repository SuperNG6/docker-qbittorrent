name: Auto Build Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: Set Version
        id: set-version
        run: |
          VERSION=$(head -n 1 ReleaseTag)
          if [[ ! "$VERSION" =~ ^[0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::ReleaseTag must contain a valid Docker image version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ReleaseTag=${VERSION}"

      # 设置 QEMU
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3
      
      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 Docker Hub
      - name: 登录到 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 缓存release tag，用作与下一次执行任务时获取到到release tag做对比
      - name: Cache tag
        id: cache-tag
        uses: actions/cache@v4
        with:
          path: ./tag/
          key: ${{ runner.os }}-tag-v${{ steps.set-version.outputs.version }}

      - name: Record uncached version
        if: steps.cache-tag.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          mkdir -p ./tag
          printf '%s\n' "$VERSION" > "./tag/tag-${VERSION}"

      - name: Build and push
        if: steps.cache-tag.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: |
            superng6/qbittorrent:${{ steps.set-version.outputs.version }}
            superng6/qbittorrent:latest
