name: Update ReleaseTag

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set Version
        id: set-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh release view --repo userdocs/qbittorrent-nox-static --json tagName --jq .tagName)
          if [[ ! "$RELEASE" =~ ^release-([0-9][A-Za-z0-9_.-]{0,127})$ ]]; then
            echo "::error::Upstream release tag must start with release- and contain a valid Docker image version"
            exit 1
          fi

          VERSION=${BASH_REMATCH[1]}
          LOCAL_VERSION=$(head -n 1 ReleaseTag)
          echo "LocalReleaseTag=${LOCAL_VERSION}"
          echo "OnlineReleaseTag=${VERSION}"

          if [[ "$LOCAL_VERSION" != "$VERSION" ]]; then
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update ReleaseTag
        if: steps.set-version.outputs.version != ''
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: printf '%s\n' "$VERSION" > ReleaseTag

      - name: Push
        if: steps.set-version.outputs.version != ''
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ReleaseTag
          git commit -m "Update ReleaseTag ${VERSION}"
          git push -v --progress
